# Temporary investigation workflow for the macOS port. Delete before merging to main.
name: macOS diagnostics

on:
  push:
    branches:
      - feat/macos-desktop
    paths:
      - .github/workflows/macos-diagnostics.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - name: Fetch the latest built app
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh run list --workflow macos-desktop.yml --branch feat/macos-desktop --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run download "$run" -n aliasmode-macos-arm64 -D "$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP"/dmg/*.dmg
          mkdir -p "$RUNNER_TEMP/Applications" "$RUNNER_TEMP/out"
          ditto "$RUNNER_TEMP/mnt/AliasMode.app" "$RUNNER_TEMP/Applications/AliasMode.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          xattr -l "$RUNNER_TEMP/Applications/AliasMode.app" || true
      - name: Arabic text in app-launched profiles with filtered font lists
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"
          app="$RUNNER_TEMP/Applications/AliasMode.app"
          data="$HOME/Library/Application Support/com.aliasmode.desktop"
          mkdir -p "$data"
          printf '{"version":1,"mode":"local","localAnalytics":false}\n' > "$data/config.json"
          worker="$app/Contents/Resources/playwright/firefox-worker.mjs"
          cp "$worker" "$RUNNER_TEMP/firefox-worker.original.mjs"
          open -n "$app"
          for attempt in $(seq 1 120); do [[ -f "$data/agent-runtime.json" ]] && break; sleep 1; done
          helper="$app/Contents/MacOS/aliasmode-mcp"
          shot() {
            created="$("$helper" profiles create --name "diag-$1" --temporary --engine firefox)"
            profile="$(jq -er '.result.id' <<<"$created")"
            "$helper" browser open --profile "$profile" --url https://example.com/
            sleep 12
            screencapture -x "$out/fonts-$1.png"
            "$helper" browser close --profile "$profile" || true
            sleep 2
          }
          shot 1-unchanged
          # Diagnostic copies only: drop hidden system fonts from the list that the engine receives.
          cp "$RUNNER_TEMP/firefox-worker.original.mjs" "$worker"
          perl -0pi -e 's/const serialized = JSON\.stringify\(config\);/const serialized = JSON.stringify({ ...config, fonts: (config.fonts || []).filter((name) => !name.startsWith(".")) });/' "$worker"
          grep -c 'startsWith(".")' "$worker"
          shot 2-no-dot-fonts
          cp "$RUNNER_TEMP/firefox-worker.original.mjs" "$worker"
          perl -0pi -e 's/const serialized = JSON\.stringify\(config\);/const serialized = JSON.stringify({ ...config, fonts: (config.fonts || []).filter((name) => !name.includes("PUA")) });/' "$worker"
          shot 3-no-pua-fonts
          cp "$RUNNER_TEMP/firefox-worker.original.mjs" "$worker"
          perl -0pi -e 's/const serialized = JSON\.stringify\(config\);/const { fonts: _fonts, ...rest } = config; const serialized = JSON.stringify(rest);/' "$worker"
          shot 4-no-font-list
          pkill -x aliasmode || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aliasmode-macos-diagnostics
          path: ${{ runner.temp }}/out
