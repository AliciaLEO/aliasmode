# Temporary investigation workflow for the macOS port. Delete before merging to main.
name: macOS diagnostics

on:
  push:
    branches:
      - feat/macos-desktop
    paths:
      - .github/workflows/macos-diagnostics.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - name: Fetch the latest built app
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh run list --workflow macos-desktop.yml --branch feat/macos-desktop --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run download "$run" -n aliasmode-macos-arm64 -D "$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP"/dmg/*.dmg
          mkdir -p "$RUNNER_TEMP/Applications" "$RUNNER_TEMP/out"
          ditto "$RUNNER_TEMP/mnt/AliasMode.app" "$RUNNER_TEMP/Applications/AliasMode.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          xattr -l "$RUNNER_TEMP/Applications/AliasMode.app" || true
      - name: Arabic text with the exact configuration of an app-launched profile
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"
          app="$RUNNER_TEMP/Applications/AliasMode.app"
          engine="$app/Contents/Resources/firefox/AliasMode.app/Contents/MacOS/aliasmode"
          data="$HOME/Library/Application Support/com.aliasmode.desktop"
          mkdir -p "$data"
          printf '{"version":1,"mode":"local","localAnalytics":false}\n' > "$data/config.json"
          # Diagnostic copy only: save the configuration that the worker hands to the engine.
          worker="$app/Contents/Resources/playwright/firefox-worker.mjs"
          perl -0pi -e 's/const serialized = JSON\.stringify\(config\);/const serialized = JSON.stringify(config);\n  try { process.getBuiltinModule("node:fs").writeFileSync("\/tmp\/aliasmode-camou-config.json", serialized); } catch {}/' "$worker"
          grep -c "aliasmode-camou-config" "$worker"
          open -n "$app"
          for attempt in $(seq 1 120); do [[ -f "$data/agent-runtime.json" ]] && break; sleep 1; done
          helper="$app/Contents/MacOS/aliasmode-mcp"
          created="$("$helper" profiles create --name diag-firefox --temporary --engine firefox)"
          profile="$(jq -er '.result.id' <<<"$created")"
          "$helper" browser open --profile "$profile" --url https://example.com/
          sleep 12
          screencapture -x "$out/real-flow.png"
          "$helper" browser close --profile "$profile" || true
          cp /tmp/aliasmode-camou-config.json "$out/exact.json"
          jq -r 'keys | join(", ")' "$out/exact.json" | cut -c1-2500
          jq 'del(.fonts)' "$out/exact.json" > "$out/v-no-fonts.json"
          jq 'with_entries(select(.key | startswith("fonts:") | not))' "$out/exact.json" > "$out/v-no-font-options.json"
          jq '{fonts}' "$out/exact.json" > "$out/v-only-fonts.json"
          jq 'with_entries(select(.key | test("^(locale|navigator\\.language|intl|headers)") | not))' "$out/exact.json" > "$out/v-no-locale.json"
          cp "$out/exact.json" "$out/v-exact.json"
          for file in "$out"/v-*.json; do
            name="$(basename "$file" .json)"
            scratch="$(mktemp -d)"
            (
              index=1
              while IFS= read -r chunk; do
                export "CAMOU_CONFIG_$index=$chunk"
                index=$((index + 1))
              done < <(bun -e 'const text = require("node:fs").readFileSync(process.argv[1], "utf8").trim(); for (let offset = 0; offset < text.length; offset += 2047) console.log(text.slice(offset, offset + 2047));' "$file")
              "$engine" -profile "$scratch" -no-remote --window-size=1000,760 "https://example.com/" > "$out/$name.log" 2>&1 &
              pid=$!
              sleep 14
              screencapture -x "$out/headed-$name.png"
              kill "$pid" 2>/dev/null || true
              sleep 2
            )
          done
          pkill -x aliasmode || true
          sleep 3
      - name: Chromium 155 search engine entry shape
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"
          app="$RUNNER_TEMP/Applications/AliasMode.app"
          data="$HOME/Library/Application Support/com.aliasmode.desktop"
          rm -f "$data/agent-runtime.json"
          open -n "$app"
          for attempt in $(seq 1 120); do [[ -f "$data/agent-runtime.json" ]] && break; sleep 1; done
          helper="$app/Contents/MacOS/aliasmode-mcp"
          created="$("$helper" profiles create --name diag-chromium --temporary)"
          profile="$(jq -er '.result.id' <<<"$created")"
          port="$("$helper" browser open --profile "$profile" | jq -er '.result.port')"
          sleep 20
          cat > "$app/Contents/Resources/playwright/engine-probe.mjs" <<'JS'
          import { chromium } from "playwright-core";
          const browser = await chromium.connectOverCDP(`http://127.0.0.1:${process.argv[2]}`);
          const page = await browser.contexts()[0].newPage();
          await page.goto("chrome://settings/searchEngines", { waitUntil: "domcontentloaded", timeout: 10_000 });
          console.log(JSON.stringify(await page.evaluate(async () => {
            const { sendWithPromise } = await import("chrome://resources/js/cr.js");
            const list = await sendWithPromise("getSearchEnginesList");
            return { listKeys: Object.keys(list), engines: Object.values(list).filter(Array.isArray).flat().slice(0, 3) };
          }), null, 1));
          await page.close();
          await browser.close();
          JS
          (cd "$app/Contents/Resources/playwright" && ./node/node engine-probe.mjs "$port") 2>&1 | tee "$out/engine-probe.log"
          "$helper" browser close --profile "$profile" || true
          pkill -x aliasmode || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aliasmode-macos-diagnostics
          path: ${{ runner.temp }}/out
