# Temporary investigation workflow for the macOS port. Delete before merging to main.
name: macOS diagnostics

on:
  push:
    branches:
      - feat/macos-desktop
    paths:
      - .github/workflows/macos-diagnostics.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - name: Fetch the latest built app
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh run list --workflow macos-desktop.yml --branch feat/macos-desktop --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run download "$run" -n aliasmode-macos-arm64 -D "$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP"/dmg/*.dmg
          mkdir -p "$RUNNER_TEMP/Applications" "$RUNNER_TEMP/out"
          ditto "$RUNNER_TEMP/mnt/AliasMode.app" "$RUNNER_TEMP/Applications/AliasMode.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          xattr -l "$RUNNER_TEMP/Applications/AliasMode.app" || true
      - name: Arabic text with the preferences of an app-launched profile
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"
          app="$RUNNER_TEMP/Applications/AliasMode.app"
          engine="$app/Contents/Resources/firefox/AliasMode.app/Contents/MacOS/aliasmode"
          data="$HOME/Library/Application Support/com.aliasmode.desktop"
          mkdir -p "$data"
          printf '{"version":1,"mode":"local","localAnalytics":false}\n' > "$data/config.json"
          # Diagnostic copy only: save the configuration that the worker hands to the engine.
          worker="$app/Contents/Resources/playwright/firefox-worker.mjs"
          perl -0pi -e 's/const serialized = JSON\.stringify\(config\);/const serialized = JSON.stringify(config);\n  try { process.getBuiltinModule("node:fs").writeFileSync("\/tmp\/aliasmode-camou-config.json", serialized); } catch {}/' "$worker"
          open -n "$app"
          for attempt in $(seq 1 120); do [[ -f "$data/agent-runtime.json" ]] && break; sleep 1; done
          helper="$app/Contents/MacOS/aliasmode-mcp"
          created="$("$helper" profiles create --name diag-firefox --temporary --engine firefox)"
          profile="$(jq -er '.result.id' <<<"$created")"
          "$helper" browser open --profile "$profile" --url https://example.com/
          sleep 12
          ps -axww -o pid=,command= | grep -F "$profile" | grep -v grep | cut -c1-1200 > "$out/firefox-processes.txt"
          find "$data" -name prefs.js -o -name user.js | tee "$out/pref-files.txt"
          prefs="$(grep -F "$profile" "$out/pref-files.txt" | grep prefs.js | head -n 1)"
          cp "$prefs" "$out/real-prefs.js"
          cp "$(dirname "$prefs")/user.js" "$out/real-user.js" 2>/dev/null || true
          "$helper" browser close --profile "$profile" || true
          pkill -x aliasmode || true
          sleep 3
          grep -ciE "font" "$out/real-prefs.js" "$out/real-user.js" 2>/dev/null
          grep -iE "font|gfx|intl\.|lang" "$out/real-prefs.js" "$out/real-user.js" 2>/dev/null | cut -c1-220 | head -60
          source_prefs="$out/real-user.js"
          [[ -s "$source_prefs" ]] || source_prefs="$out/real-prefs.js"
          cp "$source_prefs" "$out/p1-all.js"
          grep -viE "font" "$source_prefs" > "$out/p2-no-font.js"
          grep -viE "gfx" "$source_prefs" > "$out/p3-no-gfx.js"
          grep -viE "intl|locale|lang" "$source_prefs" > "$out/p4-no-language.js"
          grep -viE "privacy|resist|fingerprint" "$source_prefs" > "$out/p5-no-privacy.js"
          : > "$out/p6-none.js"
          for file in "$out"/p?-*.js; do
            name="$(basename "$file" .js)"
            scratch="$(mktemp -d)"
            cp "$file" "$scratch/user.js"
            (
              index=1
              while IFS= read -r chunk; do
                export "CAMOU_CONFIG_$index=$chunk"
                index=$((index + 1))
              done < <(bun -e 'const text = require("node:fs").readFileSync(process.argv[1], "utf8").trim(); for (let offset = 0; offset < text.length; offset += 2047) console.log(text.slice(offset, offset + 2047));' /tmp/aliasmode-camou-config.json)
              "$engine" --headless -profile "$scratch" --window-size=1000,760 --screenshot "$out/prefs-$name.png" "https://example.com/" > "$out/prefs-$name.log" 2>&1 &
              pid=$!
              for attempt in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
              kill "$pid" 2>/dev/null || true
            )
            ls -la "$out/prefs-$name.png" 2>/dev/null || { echo "no screenshot for $name"; tail -5 "$out/prefs-$name.log"; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aliasmode-macos-diagnostics
          path: ${{ runner.temp }}/out
