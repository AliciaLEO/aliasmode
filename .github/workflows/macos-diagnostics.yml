# Temporary investigation workflow for the macOS port. Delete before merging to main.
name: macOS diagnostics

on:
  push:
    branches:
      - feat/macos-desktop
    paths:
      - .github/workflows/macos-diagnostics.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - name: Fetch the latest built app
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh run list --workflow macos-desktop.yml --branch feat/macos-desktop --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run download "$run" -n aliasmode-macos-arm64 -D "$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP"/dmg/*.dmg
          mkdir -p "$RUNNER_TEMP/Applications" "$RUNNER_TEMP/out"
          ditto "$RUNNER_TEMP/mnt/AliasMode.app" "$RUNNER_TEMP/Applications/AliasMode.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          xattr -l "$RUNNER_TEMP/Applications/AliasMode.app" || true
      - name: Arabic text in a visible window, stock Firefox against the AliasMode engine
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"
          ours="$RUNNER_TEMP/Applications/AliasMode.app/Contents/Resources/firefox/AliasMode.app/Contents/MacOS/aliasmode"
          curl -sSfL -o "$RUNNER_TEMP/firefox.dmg" "https://download.mozilla.org/?product=firefox-latest-ssl&os=osx&lang=en-US"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/ffmnt" "$RUNNER_TEMP/firefox.dmg" > /dev/null
          ditto "$RUNNER_TEMP/ffmnt/Firefox.app" "$RUNNER_TEMP/Firefox.app"
          hdiutil detach "$RUNNER_TEMP/ffmnt" > /dev/null
          "$RUNNER_TEMP/Firefox.app/Contents/MacOS/firefox" --version
          system_profiler SPDisplaysDataType | head -20
          cat > "$out/arabic.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><body style="font-size:24px;margin:16px">
          <p>default: مرحبا بالعالم — هذا نص عربي</p>
          <p style="font-family:sans-serif">sans-serif: مرحبا بالعالم — هذا نص عربي</p>
          <p style="font-family:'Geeza Pro'">Geeza Pro: مرحبا بالعالم — هذا نص عربي</p>
          <p style="font-family:system-ui">system-ui: مرحبا بالعالم — هذا نص عربي</p>
          <p style="background:#222;color:#ddd;padding:6px">light on dark: مرحبا بالعالم — هذا نص عربي</p>
          <p>עברית שלום · हिन्दी नमस्ते · ไทย สวัสดี · 한국어 안녕하세요 · 日本語 こんにちは</p>
          HTML
          run() {
            scratch="$(mktemp -d)"
            printf '%s\n' 'user_pref("browser.aboutwelcome.enabled", false);' 'user_pref("datareporting.policy.dataSubmissionEnabled", false);' 'user_pref("browser.shell.checkDefaultBrowser", false);' "$3" > "$scratch/user.js"
            "$2" -no-remote -foreground -profile "$scratch" --window-size=1000,740 "file://$out/arabic.html" > "$out/visible-$1.log" 2>&1 &
            pid=$!
            sleep 16
            screencapture -x "$out/visible-$1.png"
            kill "$pid" 2>/dev/null || true
            sleep 4
          }
          run 1-stock-firefox "$RUNNER_TEMP/Firefox.app/Contents/MacOS/firefox" ""
          run 2-aliasmode-engine "$ours" ""
          run 3-aliasmode-software-rendering "$ours" 'user_pref("gfx.webrender.software", true);'
          run 4-aliasmode-no-font-allow-list "$ours" 'user_pref("layout.css.font-visibility", 3);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aliasmode-macos-diagnostics
          path: ${{ runner.temp }}/out
