# Temporary investigation workflow for the macOS port. Delete before merging to main.
name: macOS diagnostics

on:
  push:
    branches:
      - feat/macos-desktop
    paths:
      - .github/workflows/macos-diagnostics.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - name: Fetch the latest built app
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh run list --workflow macos-desktop.yml --branch feat/macos-desktop --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run download "$run" -n aliasmode-macos-arm64 -D "$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP"/dmg/*.dmg
          mkdir -p "$RUNNER_TEMP/Applications" "$RUNNER_TEMP/out"
          ditto "$RUNNER_TEMP/mnt/AliasMode.app" "$RUNNER_TEMP/Applications/AliasMode.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          xattr -l "$RUNNER_TEMP/Applications/AliasMode.app" || true
      - name: example.com in Firefox with and without the profile configuration
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"
          engine="$RUNNER_TEMP/Applications/AliasMode.app/Contents/Resources/firefox/AliasMode.app/Contents/MacOS/aliasmode"
          curl -sS -D "$out/example-headers.txt" -o "$out/example.html" https://example.com/
          head -c 3000 "$out/example.html"
          bun -e '
            import { createFirefoxProfileConfig } from "./firefox-config.ts";
            import { writeFileSync } from "node:fs";
            const out = process.argv[1];
            const full = createFirefoxProfileConfig(1280, 800, "macos").config;
            const { fonts: _fonts, ...withoutFonts } = full;
            const variants = { "a-no-config": null, "e-full-profile-config": full, "f-full-config-without-fonts": withoutFonts };
            for (const [name, config] of Object.entries(variants)) writeFileSync(`${out}/${name}.json`, JSON.stringify(config));
            console.log(JSON.stringify(withoutFonts).slice(0, 1500));
          ' "$out"
          for file in "$out"/?-*.json; do
            name="$(basename "$file" .json)"
            profile="$(mktemp -d)"
            (
              if [[ "$(cat "$file")" != "null" ]]; then
                index=1
                while IFS= read -r chunk; do
                  export "CAMOU_CONFIG_$index=$chunk"
                  index=$((index + 1))
                done < <(bun -e 'const text = require("node:fs").readFileSync(process.argv[1], "utf8"); for (let offset = 0; offset < text.length; offset += 2047) console.log(text.slice(offset, offset + 2047));' "$file")
              fi
              "$engine" --headless -profile "$profile" --window-size=1000,760 --screenshot "$out/example-$name.png" "https://example.com/" > "$out/example-$name.log" 2>&1 &
              pid=$!
              for attempt in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
              kill "$pid" 2>/dev/null || true
            )
            ls -la "$out/example-$name.png" 2>/dev/null || { echo "no screenshot for $name"; tail -5 "$out/example-$name.log"; }
          done
      - name: Real error of the search engine setup
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"
          app="$RUNNER_TEMP/Applications/AliasMode.app"
          data="$HOME/Library/Application Support/com.aliasmode.desktop"
          mkdir -p "$data"
          printf '{"version":1,"mode":"local","localAnalytics":false}\n' > "$data/config.json"
          # Diagnostic copy only: record the error that the worker normally replaces with a fixed text.
          for worker in worker.mjs playwright-worker.mjs; do
            perl -0pi -e 's/exitCode = 1;\n    const code = error\?\.code/exitCode = 1;\n    try { (await import("node:fs")).appendFileSync("\/tmp\/aliasmode-worker-errors.log", new Date().toISOString() + " " + String(error?.stack || error) + "\\n"); } catch {}\n    const code = error?.code/' "$app/Contents/Resources/playwright/$worker"
            grep -c "aliasmode-worker-errors" "$app/Contents/Resources/playwright/$worker"
          done
          open -n "$app"
          for attempt in $(seq 1 120); do [[ -f "$data/agent-runtime.json" ]] && break; sleep 1; done
          helper="$app/Contents/MacOS/aliasmode-mcp"
          created="$("$helper" profiles create --name diag-chromium --temporary)"
          profile="$(jq -er '.result.id' <<<"$created")"
          "$helper" browser open --profile "$profile"
          for second in 2 5 8; do sleep 3; screencapture -x "$out/chromium-after-open-$second.png"; done
          sleep 25
          cat /tmp/aliasmode-worker-errors.log | cut -c1-1500 | tee "$out/worker-errors.log"
          cp "$data"/logs/*.log "$out/" 2>/dev/null || true
          "$helper" browser close --profile "$profile" || true
          pkill -x aliasmode || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aliasmode-macos-diagnostics
          path: ${{ runner.temp }}/out
