# Temporary investigation workflow for the macOS port. Delete before merging to main.
name: macOS diagnostics

on:
  push:
    branches:
      - feat/macos-desktop
    paths:
      - .github/workflows/macos-diagnostics.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - name: Fetch the latest built app
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh run list --workflow macos-desktop.yml --branch feat/macos-desktop --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run download "$run" -n aliasmode-macos-arm64 -D "$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP"/dmg/*.dmg
          mkdir -p "$RUNNER_TEMP/Applications" "$RUNNER_TEMP/out"
          ditto "$RUNNER_TEMP/mnt/AliasMode.app" "$RUNNER_TEMP/Applications/AliasMode.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          xattr -l "$RUNNER_TEMP/Applications/AliasMode.app" || true
      - name: Arabic text in a visible window, sealed engine against the published engine
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out"
          sealed="$RUNNER_TEMP/Applications/AliasMode.app/Contents/Resources/firefox/AliasMode.app"
          mkdir -p "$RUNNER_TEMP/published"
          curl -sSfL -o "$RUNNER_TEMP/engine.zip" https://github.com/aliasmode/aliasmode-firefox/releases/download/aliasmode-runtime-152.0.4-beta.30-r4/aliasmode-152.0.4-beta.30-mac.arm64.zip
          echo "a9847893bbe0472114cfc35b9f67ecb741f9a59002ac7d9e867634594792d320  $RUNNER_TEMP/engine.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/engine.zip" "$RUNNER_TEMP/published"
          published="$RUNNER_TEMP/published/AliasMode.app"
          codesign -d --entitlements - "$published/Contents/MacOS/aliasmode" 2>&1 | head -20
          codesign -d --entitlements - "$sealed/Contents/MacOS/aliasmode" 2>&1 | head -20
          cat > "$out/arabic.html" <<'HTML'
          <!doctype html><meta charset="utf-8"><body style="font-size:26px;margin:16px">
          <p>default: مرحبا بالعالم — هذا نص عربي</p>
          <p style="font-family:serif">serif: مرحبا بالعالم — هذا نص عربي</p>
          <p style="font-family:sans-serif">sans-serif: مرحبا بالعالم — هذا نص عربي</p>
          <p style="font-family:'Geeza Pro'">Geeza Pro: مرحبا بالعالم — هذا نص عربي</p>
          <p style="font-family:system-ui">system-ui: مرحبا بالعالم — هذا نص عربي</p>
          <p style="font:16px/1.6 system-ui,sans-serif">page style: هذا النطاق مُخصص للاستخدام في أمثلة التوثيق</p>
          HTML
          for variant in sealed published; do
            if [[ "$variant" == sealed ]]; then engine="$sealed"; else engine="$published"; fi
            for page in "https://example.com/" "file://$out/arabic.html"; do
              name="$variant-$(basename "$page" .html | tr -c 'a-z' '-' | cut -c1-12)"
              scratch="$(mktemp -d)"
              "$engine/Contents/MacOS/aliasmode" -no-remote -foreground -profile "$scratch" --window-size=1000,740 "$page" > "$out/visible-$name.log" 2>&1 &
              pid=$!
              sleep 16
              screencapture -x "$out/visible-$name.png"
              kill "$pid" 2>/dev/null || true
              sleep 4
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aliasmode-macos-diagnostics
          path: ${{ runner.temp }}/out
